[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.6", "alembic==1.15.2", "pydantic-settings==2.8.1",
  "httpx==0.28.1", "python-multipart==0.0.20", "qdrant-client==1.18.0",
  "PyMuPDF==1.25.5", "python-docx==1.1.2", "jieba==0.42.1",
  "beautifulsoup4==4.13.4", "Pillow==11.2.1", "numpy==1.26.4", "tokenizers==0.21.1"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.7", "mypy==1.15.0", "types-beautifulsoup4==4.12.0.20250204"]
ocr = ["paddlepaddle==3.0.0", "paddleocr==3.0.3", "paddlex[ocr]==3.0.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and Qdrant", "live: requires configured external APIs", "ocr: requires local OCR assets"]

[tool.ruff]
line-length = 110

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
